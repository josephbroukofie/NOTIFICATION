name: Forex news alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forex-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run alert script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LEAD_MINUTES: "30"
          LOCAL_TZ: "Africa/Accra"
          CURRENCIES: ""
        run: python alert.py ${{ inputs.test && '--test' || '' }}

      - name: Save sent-alerts state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update sent alerts" && git push)
